# Streamlit app theme. Same values as src/sentinel/dashboard/theme.py (2026-11-25 redesign:
# near-black page, #121214 cards; palette validated on that surface).
[theme]
base = "dark"
primaryColor = "#3987e5"
backgroundColor = "#09090b"
secondaryBackgroundColor = "#121214"
textColor = "#f0efec"
font = "sans serif"
baseRadius = "medium"
borderColor = "#232327"
showWidgetBorder = true

[server]
headless = true
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
