repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
  - repo: local
    hooks:
      # Lint + mypy run inside the hardened Docker sandbox (see Makefile).
      - id: sandbox-lint
        name: make lint (docker sandbox)
        entry: make lint
        language: system
        pass_filenames: false
        types: [python]
  # Stage 10: block commits that contain secrets (scans the staged changes).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
