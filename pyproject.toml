[project]
name = "sentinel-gate"
version = "0.1.0"
description = "Safe deployment of malware detection models: release gate, ring rollout, automatic rollback."
requires-python = ">=3.11,<3.12"
dependencies = [
    "huggingface-hub>=0.32",
    "numpy>=1.26",
    "orjson>=3.10",
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "structlog>=24.4",
    # Official EMBER feature v3 code, pinned to a reviewed commit (not on PyPI).
    "thrember @ git+https://github.com/FutureComputing4AI/EMBER2024@0ef753e81d98bf209f71b03cd331dfc190b5b54d",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
# Supply-chain guard: only resolve package versions published before this date.
exclude-newer = "2026-11-01T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "T20"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T20"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["thrember.*", "huggingface_hub.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["integration: needs docker compose services"]

[tool.coverage.run]
source = ["src/sentinel"]
branch = true
