# Sentinel Gate local stack: api, postgres, mlflow, jaeger (Stage 3); redpanda + live and
# shadow consumers (Stage 4); the replay producer runs on demand (`make replay WEEKS=...`).
# No Prometheus / Grafana: metrics go to PostgreSQL (Stage 8), traces to Jaeger, dashboards
# in Streamlit. Every port is published on 127.0.0.1 only. Secrets come from .env.
#   make up      make down
name: sentinel

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  pids_limit: 512

x-app: &app
  <<: *hardened
  image: sentinel-app:dev   # built by `make up` (docker/sandbox.Dockerfile, target app)
  user: "10001:10001"
  tmpfs: ["/tmp:rw,nosuid,nodev,size=2g"]
  environment: &app_env
    SENTINEL_DATA_DIR: /data
    SENTINEL_LOG_LEVEL: ${SENTINEL_LOG_LEVEL:-INFO}
    HOME: /tmp

services:
  postgres:
    <<: *hardened
    image: postgres:17.6-alpine3.22@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    # the entrypoint needs these to initialise the volume, then drops to the postgres user
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    tmpfs: ["/tmp", "/var/run/postgresql"]
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel_admin
      POSTGRES_PASSWORD: ${SENTINEL_PG_ADMIN_PASSWORD:?set SENTINEL_PG_ADMIN_PASSWORD in .env}
      SENTINEL_API_DB_PASSWORD: ${SENTINEL_API_DB_PASSWORD:?set SENTINEL_API_DB_PASSWORD in .env}
      SENTINEL_SHADOW_DB_PASSWORD: ${SENTINEL_SHADOW_DB_PASSWORD:?set SENTINEL_SHADOW_DB_PASSWORD in .env}
      SENTINEL_GATE_DB_PASSWORD: ${SENTINEL_GATE_DB_PASSWORD:?set SENTINEL_GATE_DB_PASSWORD in .env}
      SENTINEL_ROLLOUT_DB_PASSWORD: ${SENTINEL_ROLLOUT_DB_PASSWORD:?set SENTINEL_ROLLOUT_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel_admin -d sentinel"]
      interval: 5s
      timeout: 3s
      retries: 20

  mlflow:
    <<: *app
    # The Stage 2 registry: SQLite + file artifacts under $SENTINEL_DATA_DIR/mlflow.
    command: >
      mlflow server --backend-store-uri sqlite:////data/mlflow/mlflow.db
      --default-artifact-root file:///data/mlflow/artifacts
      --host 0.0.0.0 --port 5000 --workers 1
      --allowed-hosts mlflow:5000,localhost:5000,127.0.0.1:5000
    volumes:
      - ${SENTINEL_DATA_DIR:?set SENTINEL_DATA_DIR in .env}/mlflow:/data/mlflow
    ports: ["127.0.0.1:5000:5000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    <<: *app
    command: >
      uvicorn --factory sentinel.serving.app:build_app
      --host 0.0.0.0 --port 8000 --workers 1 --no-access-log
    environment:
      <<: *app_env
      SENTINEL_MLFLOW_URI: http://mlflow:5000
      MLFLOW_ENABLE_ARTIFACTS_PROGRESS_BAR: "false"
      SENTINEL_PG_DSN: postgresql://sentinel_api:${SENTINEL_API_DB_PASSWORD}@postgres:5432/sentinel
      # Stage 6 kill switch (POST /admin/rollback, header X-API-Key); empty = disabled
      SENTINEL_ADMIN_API_KEY: ${SENTINEL_ADMIN_API_KEY:-}
    volumes:
      # artifacts are read straight from the registry's file store (read-only)
      - ${SENTINEL_DATA_DIR}/mlflow:/data/mlflow:ro
    ports: ["127.0.0.1:${SENTINEL_API_PORT:-18080}:8000"]   # host 8000/8080 are often taken (Splunk, Java servers)
    mem_limit: 3g
    depends_on:
      postgres: {condition: service_healthy}
      mlflow: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30

  jaeger:
    <<: *hardened
    # Traces (wired into the api in Stage 8). UI: http://127.0.0.1:16686
    image: jaegertracing/jaeger:2.11.0@sha256:b585df1b6299bbbd16bf7c679da30389349736e4b6bc8f4f500142a75bf26ca8
    tmpfs: ["/tmp"]
    ports: ["127.0.0.1:16686:16686"]
    expose: ["4317", "4318"]

  redpanda:
    <<: *hardened
    # Kafka-compatible broker, single node. Topic `file-events` is created by the producer.
    image: redpandadata/redpanda:v25.2.9@sha256:bd6c35647153a4dbc19507c8037dcca0802484c23e6e5fbb97591a62539e313a
    command: >
      redpanda start --mode dev-container --smp 1 --memory 1G --overprovisioned
      --kafka-addr internal://0.0.0.0:9092
      --advertise-kafka-addr internal://redpanda:9092
      --rpc-addr 0.0.0.0:33145 --advertise-rpc-addr redpanda:33145
    tmpfs: ["/tmp:uid=101,gid=101", "/etc/redpanda:uid=101,gid=101,mode=0755"]   # image runs as uid 101
    volumes:
      - redpanda:/var/lib/redpanda/data
    mem_limit: 1536m
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --exit-when-healthy"]
      interval: 5s
      timeout: 10s
      retries: 30

  live-consumer:
    <<: *app
    # Consumer A: every event -> POST /v1/score on the api (verdicts that count).
    command: python -m sentinel.replay.live_consumer
    mem_limit: 1g
    depends_on:
      redpanda: {condition: service_healthy}
      api: {condition: service_healthy}

  shadow-consumer:
    <<: *app
    # Consumer B: separate process + own DB login; scores with the `candidate` alias only.
    command: python -m sentinel.replay.shadow_consumer
    environment:
      <<: *app_env
      SENTINEL_MLFLOW_URI: http://mlflow:5000
      MLFLOW_ENABLE_ARTIFACTS_PROGRESS_BAR: "false"
      SENTINEL_SHADOW_DSN: postgresql://sentinel_shadow:${SENTINEL_SHADOW_DB_PASSWORD}@postgres:5432/sentinel
    volumes:
      - ${SENTINEL_DATA_DIR}/mlflow:/data/mlflow:ro
    mem_limit: 2g
    depends_on:
      redpanda: {condition: service_healthy}
      postgres: {condition: service_healthy}
      mlflow: {condition: service_healthy}

  producer:
    <<: *app
    # One-shot: `make replay WEEKS="53 54"` (not started by `make up`).
    profiles: ["tools"]
    restart: "no"
    entrypoint: ["python", "-m", "sentinel.replay.producer"]
    volumes:
      - ${SENTINEL_DATA_DIR}/splits:/data/splits:ro
    mem_limit: 3g
    depends_on:
      redpanda: {condition: service_healthy}

volumes:
  pgdata:
  redpanda:
